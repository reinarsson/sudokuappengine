name: Reader CI

on:
  push:
    branches: [ main ]
    paths: [ 'reader/**', '.github/workflows/reader-ci.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'reader/**', '.github/workflows/reader-ci.yml' ]

jobs:
  build:
    name: Lint + build + unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (ktlint)
        run: ./gradlew -p reader ktlintCheck

      - name: Build + unit tests + coverage
        run: ./gradlew -p reader assembleDebug testDebugUnitTest koverVerify

      # Package the instrumented-test APK on the cheap runner (no emulator) so packaging issues
      # surface here with a stacktrace instead of inside the slow emulator job.
      - name: Assemble instrumented-test APK
        run: ./gradlew -p reader assembleDebugAndroidTest --stacktrace

  oracle:
    name: Instrumented oracle (emulator)
    runs-on: ubuntu-latest
    # Only spend emulator minutes once lint/build/unit tests pass.
    needs: build
    strategy:
      matrix:
        api-level: [ 29 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # The emulator needs hardware acceleration (KVM) to boot in reasonable time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Runs the end-to-end oracle (OracleEndToEndTest), board-not-found, and empty-cell tests
      # against the committed digits.tflite on a real emulator. This is the true correctness gate.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: pixel_2
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew -p reader connectedDebugAndroidTest --stacktrace
