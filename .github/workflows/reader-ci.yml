name: Reader CI

on:
  push:
    branches: [ main ]
    paths: [ 'reader/**', '.github/workflows/reader-ci.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'reader/**', '.github/workflows/reader-ci.yml' ]

jobs:
  build:
    name: Lint + build + unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (ktlint)
        run: ./gradlew -p reader ktlintCheck

      - name: Build + unit tests
        run: ./gradlew -p reader assembleDebug testDebugUnitTest

  # The end-to-end oracle is an Android instrumented test: it needs an emulator AND the committed
  # src/main/assets/digits.tflite. Added with the pipeline implementation (uses
  # reactivecircus/android-emulator-runner + ./gradlew -p reader connectedDebugAndroidTest).
