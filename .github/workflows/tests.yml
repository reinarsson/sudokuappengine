name: Tests and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Run tests with coverage
        id: gradle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ./gradlew test koverVerify --no-daemon 2>&1 | tee gradle_output.txt

      - name: Post test results comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.existsSync('gradle_output.txt')
              ? fs.readFileSync('gradle_output.txt', 'utf8')
              : '(no output)';
            const passed = '${{ steps.gradle.outcome }}' === 'success';
            const icon = passed ? '✅' : '❌';
            const trimmed = output.length > 3000
              ? '...(truncated)\n' + output.slice(-3000)
              : output;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🧪 Test & Coverage Report\n\n` +
                    `${icon} ${passed ? 'All tests passed, coverage ≥ 80%' : 'Tests failed or coverage < 80%'}\n\n` +
                    `<details><summary>Full output</summary>\n\n\`\`\`\n${trimmed}\n\`\`\`\n</details>`
            });

      - name: Fail if tests or coverage not met
        if: steps.gradle.outcome == 'failure'
        run: exit 1
