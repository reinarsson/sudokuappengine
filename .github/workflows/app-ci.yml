name: App CI

on:
  push:
    branches: [ main ]
    paths: [ 'app/**', '.github/workflows/app-ci.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'app/**', '.github/workflows/app-ci.yml' ]

jobs:
  build:
    name: Lint + build + unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (ktlint)
        run: ./gradlew -p app ktlintCheck

      - name: Build + unit tests + coverage
        run: ./gradlew -p app assembleDebug testDebugUnitTest koverVerify
