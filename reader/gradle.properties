# AndroidX is required by the androidx.test instrumentation deps used by the oracle.
android.useAndroidX=true
# Keep R classes non-transitive (smaller, faster; AGP 8 default-on, set explicitly).
android.nonTransitiveRClass=true
# Gradle's default 512m heap OOMs when zipflinger packages the large OpenCV + LiteRT native
# libs while an emulator is also consuming RAM (the instrumented-test job). 2g is comfortable.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
